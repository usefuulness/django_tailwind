{% extends 'base.html' %}

{% block content %}
<div class="min-h-screen flex items-center justify-center">
    <div class="text-center p-8 max-w-lg">
        <h1 class="text-6xl font-bold text-gray-800 mb-4">{{ error_code }}</h1>
        <h2 class="text-2xl font-semibold text-gray-700 mb-4">{{ error_title }}</h2>
        <p class="text-gray-600 mb-8">{{ error_message }}</p>
        <a href="{% url 'index' %}" class="inline-block bg-blue-500 hover:bg-blue-600 text-white font-semibold py-3 px-6 rounded-lg transition duration-200">
            Return Home
        </a>
    </div>
</div>
{% endblock %}
